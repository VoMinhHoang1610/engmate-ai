name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: python scripts/manage.py setup
      - name: Lint and types
        run: python scripts/manage.py lint
      - name: Tests and coverage
        run: python scripts/manage.py coverage
      - name: Frontend production build
        run: python scripts/manage.py build
      - name: Validate Docker
        run: python scripts/manage.py docker-check
      - name: Start stack
        run: python scripts/manage.py docker-up
      - name: HTTP smoke including API proxy
        run: python scripts/manage.py smoke
      - name: Logs on failure
        if: failure()
        run: docker compose -p engmate-ai logs --no-color
      - name: Stop stack
        if: always()
        run: python scripts/manage.py down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/
