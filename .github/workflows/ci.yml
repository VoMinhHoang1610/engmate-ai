name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: EngMate-CI-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client libodbc2
      - name: Tạo schema test riêng
        env:
          MYSQL_PWD: EngMate-CI-${{ github.run_id }}-${{ github.run_attempt }}
        run: sed 's/EngMateAI/EngMateAI_ci_test/g' gemini-code-1791478978574.sql | mysql --host=127.0.0.1 --user=root --default-character-set=utf8mb4
      - name: Install
        run: python scripts/manage.py setup
      - name: Lint and types
        run: python scripts/manage.py lint
      - name: Tests and coverage
        env:
          MYSQL_TEST_URL: "mysql+pymysql://root:EngMate-CI-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:3306/EngMateAI_ci_test?charset=utf8mb4"
        run: python scripts/manage.py coverage
      - name: Frontend production build
        run: python scripts/manage.py build
      - name: Validate Docker
        run: python scripts/manage.py docker-check
      - name: Start stack
        run: python scripts/manage.py docker-up
      - name: HTTP smoke including API proxy
        run: python scripts/manage.py smoke
      - name: Logs on failure
        if: failure()
        run: docker compose -p engmate-ai logs --no-color
      - name: Stop stack
        if: always()
        run: python scripts/manage.py down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/
