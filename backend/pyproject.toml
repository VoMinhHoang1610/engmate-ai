[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "engmate-ai-backend"
version = "0.1.0"
description = "FastAPI backend for EngMate-AI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.54,<2.1",
    "pyodbc>=5.2,<6",
    "PyMySQL[rsa]>=1.1.1,<2",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=25.1,<26",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<0.1",
    "Pillow>=12,<13",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.8,<5",
    "black>=25.1,<27",
    "editables>=0.5,<1",
    "hatchling>=1.27,<2",
    "mypy>=1.15,<3",
    "pip-tools>=7.4,<8",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../.cache/pytest"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
