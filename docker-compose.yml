name: engmate-ai
services:
  backend:
    build: ./backend
    environment:
      APP_NAME: ${APP_NAME:-EngMate-AI}
      AVATAR_STORAGE_DIR: /data/avatars
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-blaze}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_VOICE: ${GEMINI_VOICE:-Kore}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_VOICE: ${OPENAI_VOICE:-marin}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
      VOICE_MAX_SESSION_SECONDS: ${VOICE_MAX_SESSION_SECONDS:-600}
      VOICE_VAD_SILENCE_MS: ${VOICE_VAD_SILENCE_MS:-900}
      VOICE_VAD_THRESHOLD: ${VOICE_VAD_THRESHOLD:-0.5}
      BLAZE_API_KEY: ${BLAZE_API_KEY:-}
      BLAZE_TTS_MODEL: ${BLAZE_TTS_MODEL:-v2.0_pro}
      BLAZE_STT_MODEL: ${BLAZE_STT_MODEL:-stt-async-1.5}
      BLAZE_LOCAL_DEMO: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      DATABASE_MYSQL_URL: ${DOCKER_DATABASE_MYSQL_URL:-${DATABASE_MYSQL_URL:-}}
      DATABASE_ODBC_CONNECTION: ${DATABASE_ODBC_CONNECTION:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-30}
    ports: ["127.0.0.1:${BACKEND_PORT:-8010}:8000"]
    volumes: ["./backend/app:/app/app:ro", "./.artifacts/avatars:/data/avatars"]
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-5174}:5174"]
    volumes: ["./frontend/src:/app/src:ro"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
