name: engmate-ai
services:
  backend:
    build: ./backend
    environment:
      APP_NAME: ${APP_NAME:-EngMate-AI}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      DATABASE_ODBC_CONNECTION: ${DATABASE_ODBC_CONNECTION:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      MEDIA_DIRECTORY: /app/media
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5174}
    ports: ["127.0.0.1:${BACKEND_PORT:-8010}:8000"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./database/sqlserver:/database/sqlserver:ro
      - learning-media:/app/media
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-5174}:5174"]
    volumes: ["./frontend/src:/app/src:ro"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
volumes:
  learning-media:
